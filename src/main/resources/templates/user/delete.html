<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ユーザー削除</title>
<link rel="stylesheet" th:href="@{/css/user.css}">
</head>
<body>
	<div class="container">
		<div class="title">ユーザー削除</div>
		<p class="message" th:text="${message}"></p>
		<form th:action="@{/users/delete/search}" method="post" class="user-form">

			<div class="form-area" th:object="${deleteUser}">
				<div class="form-row">
					<label for="No" class="form-label">No</label>
					<input type="number" id="No" name="No" class="form-control" value="*{id}">
				</div>
				 
				<div class="form-row">
					<label for="name" class="form-label">氏名</label>
					<input type="text" id="name" name="name" class="form-control" value="*{username}">
				</div>
				
				<div class="form-row">
					<label for="authority" class="form-label">権限</label>
					<select id="authority" class="form-control" disabled>
						<option value="*{authority}">選択不可</option>
					</select>
				</div>

				<div class="button-area">
					<button type="submit" class="create-button">検索する</button>
					<a th:href="@{/}" class="back-button">戻る</a>
				</div>
			</div>
			
		</form>
	</div>
</body>
</html>
